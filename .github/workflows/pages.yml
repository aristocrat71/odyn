name: pages

# Publishes site/ — the landing page — to GitHub Pages.
#
# There is nothing to build: site/index.html is one self-contained file with no
# relative asset paths, so it works unchanged at any base path and the job just
# uploads the folder.
#
# One-time setup: Settings → Pages → Build and deployment → Source must be set
# to **GitHub Actions**. Without it `deploy-pages` fails with "Get Pages site
# failed"; enabling it is not something a workflow can do for itself.
on:
  push:
    branches: [main]
    # Only when the page (or this file) actually changes — a release or a Rust
    # commit has nothing to republish.
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy in flight: a half-finished Pages deployment is a broken
# site, and the queued run will publish the newer commit anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish the deployment
      id-token: write # OIDC token deploy-pages exchanges for its upload credentials
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to full commit SHAs, not movable tags — same reasoning as
      # release.yml; the version is in the trailing comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
