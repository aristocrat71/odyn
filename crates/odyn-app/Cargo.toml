[package]
name = "odyn-app"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "odyn_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
odyn-core = { path = "../odyn-core" }
futures = { workspace = true }
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }

# Spotlight is a real NSPanel on macOS: non-activating, so the app in front
# keeps focus. Branch-pinned like asklight; Cargo.lock holds the exact rev.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
